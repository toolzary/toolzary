<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results | Toolzary – Free Online Tools</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="icon" href="/assets/icons/favicon.svg">
    <link rel="stylesheet" href="/assets/css/search.css">
</head>
<body>
    <!-- ========== HEADER ========== -->
    <header>
        <a href="/" class="logo logo-text">
            <img src="/assets/icons/logo.svg" alt="Toolzary Logo" width="32" height="32">
            Toolzary
        </a>
        <div class="search-wrapper">
            <label for="globalSearch" class="sr-only">Search Tools</label>
            <span class="search-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </span>
            <input type="text" id="globalSearch" placeholder="Search tools..." autofocus>
        </div>
        <div class="header-actions">
            <a href="/Contact" class="nav-link">Contact Us</a>
            <a href="/about" class="nav-link">About Toolzary</a>
            <a href="/faq" class="nav-link">FAQs</a>
            <button id="darkToggle" class="outline">Dark Mode</button>
        </div>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main>
        <div class="search-results-container">
            <!-- Search Results Header -->
            <div id="searchResultsHeader" class="search-results-header" style="display: none;">
                <h1>
                    <span class="search-icon-header">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m21 21-4.34-4.34"/>
                            <circle cx="11" cy="11" r="8"/>
                        </svg>
                    </span>
                    Results for "<span class="query-text" id="searchTermDisplay"></span>"
                </h1>
                <div class="result-meta">
                    <span><strong id="searchResultCount"></strong></span>
                    <span id="categoryFilterDisplay" style="display: none;">
                        <span class="category-badge" id="categoryBadge"></span>
                    </span>
                    <span class="result-time">
                        <span class="dot"></span>
                        <span id="searchTimeDisplay"></span>
                    </span>
                </div>
            </div>

            <!-- Results Grid -->
            <div id="searchResultsGrid" class="search-results-grid">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Searching tools...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- ========== SCRIPTS ========== -->
    <!-- Main Script - loads tools into window.TOOLS and exposes search functions -->
    <script src="/assets/js/script.js"></script>
    <script src="/assets/js/search.js"></script>
    <script src="/assets/js/footer.js"></script>
</body>
</html>
