<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 400" width="1920" height="400">
  
  <!-- Background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  
  <rect width="1920" height="400" fill="url(#grad)"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="300" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1700" cy="200" r="350" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Logo -->
  <g transform="translate(960, 190)">
    <circle cx="0" cy="0" r="70" fill="rgba(255,255,255,0.06)"/>
    <circle cx="0" cy="0" r="55" fill="rgba(255,255,255,0.10)"/>
    
    <!-- T Logo -->
    <rect x="-35" y="-18" width="70" height="18" rx="9" fill="white"/>
    <rect x="-9" y="-18" width="18" height="65" rx="9" fill="white"/>
  </g>
  
  <!-- Brand Name -->
  <text x="1080" y="190" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="white" letter-spacing="2">Toolzary</text>
  
  <!-- Tagline -->
  <text x="1080" y="240" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#FCD34D">Free Online Tools</text>
  
</svg>