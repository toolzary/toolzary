<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  
  <!-- Background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#grad)"/>
  
  <!-- Decorative circles -->
  <circle cx="250" cy="250" r="450" fill="rgba(255,255,255,0.04)"/>
  <circle cx="830" cy="830" r="500" fill="rgba(255,255,255,0.04)"/>
  
  <!-- COLOSSAL LOGO -->
  <g transform="translate(540, 430)">
    <circle cx="0" cy="0" r="320" fill="rgba(255,255,255,0.04)"/>
    <circle cx="0" cy="0" r="260" fill="rgba(255,255,255,0.07)"/>
    <circle cx="0" cy="0" r="200" fill="rgba(255,255,255,0.10)"/>
    <circle cx="0" cy="0" r="140" fill="rgba(255,255,255,0.14)"/>
    
    <!-- T Logo - ULTRA MASSIVE -->
    <rect x="-160" y="-80" width="320" height="80" rx="40" fill="white"/>
    <rect x="-40" y="-80" width="80" height="290" rx="40" fill="white"/>
  </g>
  
  <!-- Brand Name -->
  <text x="540" y="760" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="5">Toolzary</text>
  
  <!-- Tagline -->
  <text x="540" y="840" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#FCD34D" text-anchor="middle" letter-spacing="2">Free Online Tools</text>
  
  <!-- URL Footer -->
  <text x="1040" y="1050" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.25)" text-anchor="end">toolzary.com</text>
  
</svg>